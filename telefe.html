<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tenis En Vivo - Canal Permanente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column; /* Cambiado a columna para que el título quede arriba */
            justify-content: center;
            align-items: center;
        }
        /* Contenedor que centra el reproductor en el celular */
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 700px; /* Respeta el ancho máximo original */
            aspect-ratio: 700 / 438; /* Mantiene la proporción perfecta del video */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* El iframe con tu enlace exacto */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #000000;
        }
    </style>
</head>
<body>

    <div style="width: 100%; background-color: #ff9800; text-align: center; padding: 10px 0px; font-family: sans-serif; font-weight: bold; color: #000000; font-size: 14px; margin-bottom: 10px;">
        ⚠️ ¿No carga el canal? Algunos proveedores (como Claro) bloquean la señal. Para solucionarlo y ver sin restricciones, activa una app de VPN en tu celular.
    </div>

    <div class="video-wrapper">
        <iframe 
            src="https://embed.saohgdasregions.fun/embed/telefe.php" 
            allowfullscreen="true" 
            scrolling="no" 
            frameborder="0"
            allow="autoplay; encrypted-media; picture-in-picture"
            sandbox="allow-scripts allow-same-origin">
        </iframe>
    </div>

</body>
</html>
